<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grow a Cat</title>
        <link rel="icon" href="./assets/cat/catIdle.png" />
        <link rel="stylesheet" href="style.css" />

        <script defer src="./scripts/classes/Cat.js"></script>
        <script defer src="./scripts/classes/Food.js"></script>
        <script defer src="./scripts/classes/PetAction.js"></script>
        <script defer src="./scripts/systems/saveSystem.js"></script>
        <script defer src="./scripts/systems/statSystem.js"></script>
        <script defer src="./scripts/UI/catStats.js"></script>
        <script defer src="./scripts/UI/foodMenu.js"></script>
        <script defer src="./scripts/UI/petMenu.js"></script>
        <script defer src="./scripts/mainScript.js"></script>
    </head>

    <body>
        <h1>Grow a Cat</h1>
        <div id="game-container">
            <div id="cat-container">
                <button id="go-to-sleep">Go to sleep</button>
                <div id="cat-box">
                    <p id="cat-name"></p>
                    <img id="cat" src="./assets/cat/catIdle.png" alt="Cat" />
                </div>
            </div>
            <div id="actions">
                <button class="action-button" id="feed-button">Feed</button>
                <button class="action-button" id="play-button">Play</button>
                <button class="action-button" id="pet-button">Pet</button>
            </div>
            <div id="food-menu"></div>
            <div id="pet-menu"></div>
            <div id="cat-stats">
                <input id="name-of-cat" type="text" name="Cat name" />
                <p id="cat-age"></p>
                <div id="stats-content">
                    <img
                        alt="cat"
                        id="cat-stats-img"
                        src="/assets/cat/catIdle.png"
                    />
                    <div id="stats-bars">
                        <div id="cat-happiness" class="bar-container">
                            happiness
                        </div>
                        <div id="cat-hunger" class="bar-container">fulness</div>
                        <div id="cat-energy" class="bar-container">energy</div>
                        <div id="cat-cleanliness" class="bar-container">
                            cleanliness
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
